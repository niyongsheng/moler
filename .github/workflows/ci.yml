name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcodegen mole

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Release (universal)
        run: |
          xcodebuild -project Moler.xcodeproj \
            -scheme Moler \
            -configuration Release \
            -derivedDataPath .build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign app
        run: |
          APP=".build/Build/Products/Release/Moler.app"
          # No Developer ID available, but a valid ad-hoc bundle signature keeps
          # Gatekeeper from reporting a downloaded copy as "damaged".
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Moler"

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package PKG
        run: |
          APP=".build/Build/Products/Release/Moler.app"

          pkgbuild \
            --component "$APP" \
            --install-location /Applications \
            --identifier dev.niyongsheng.moler \
            --version "${{ steps.version.outputs.VERSION }}" \
            --scripts packaging/pkg-scripts \
            "Moler.pkg"

          pkgutil --payload-files "Moler.pkg"

      - name: Package DMG
        run: |
          APP=".build/Build/Products/Release/Moler.app"
          TMP="dmg_tmp"

          mkdir -p "$TMP"
          cp -R "$APP" "$TMP/"
          ln -s /Applications "$TMP/Applications"

          hdiutil create -volname Moler -srcfolder "$TMP" -ov -format UDZO "Moler.dmg"
          rm -rf "$TMP"

      - name: Package ZIP
        run: ditto -c -k --sequesterRsrc --keepParent ".build/Build/Products/Release/Moler.app" "Moler.zip"

      - name: Upload app (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Moler.app
          path: .build/Build/Products/Release/Moler.app

      - name: Upload PKG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Moler.pkg
          path: Moler.pkg

      - name: Upload DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Moler.dmg
          path: Moler.dmg

      - name: Upload ZIP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Moler.zip
          path: Moler.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Moler.pkg
          path: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: Moler.dmg
          path: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: Moler.zip
          path: release-artifacts

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          cd release-artifacts
          VERSION="${{ steps.version.outputs.VERSION }}"

          mv Moler.dmg "Moler-${VERSION}.dmg"
          mv Moler.zip "Moler-${VERSION}.zip"
          mv Moler.pkg "Moler-${VERSION}-mac-universal.pkg"
          # Stable name so the landing page can always link to the newest
          # installer: /releases/latest/download/Moler.pkg
          cp "Moler-${VERSION}-mac-universal.pkg" Moler.pkg

          ls -lh

      - name: Compose release body
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || true)
          {
            echo "## Download"
            echo
            echo "| Platform | Installer |"
            echo "| --- | --- |"
            echo "| macOS 14+ (Apple Silicon & Intel) | [Moler-${VERSION}-mac-universal.pkg](${BASE}/Moler-${VERSION}-mac-universal.pkg) |"
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log --no-merges --reverse --format='- %s (%h)' "${PREV_TAG}..HEAD" | grep -E '^- (feat|fix|perf)(\(|:)' || true)
              echo
              echo "## What's Changed"
              echo
              if [ -n "$CHANGES" ]; then
                echo "$CHANGES"
                echo
              fi
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-body.md
          cat release-body.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: release-artifacts/*
